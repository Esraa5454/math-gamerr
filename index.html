<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رحلة بطل اللعب الآمن</title>
<style>
:root{--navy:#1b2a6b;--sky:#3fa9f5;--yel:#ffc52e;--grn:#2ecc71;--red:#ff5a5f;--pur:#8b5cf6;--ink:#1d2548}
*{box-sizing:border-box;margin:0}
body{font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(#bfe6ff,#e9f7ff 55%,#fff6d6);background-attachment:fixed;overflow-x:hidden}
body:before,body:after{content:"☁️";position:fixed;font-size:70px;opacity:.55;top:12%;animation:drift 40s linear infinite;pointer-events:none}
body:after{top:55%;font-size:50px;animation-duration:60s;animation-delay:-20s}
@keyframes drift{from{right:-90px}to{right:105%}}
#hud{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap;border-bottom:5px solid var(--yel)}
#hud b{font-size:18px}.hp{display:flex;gap:6px;align-items:center;background:#ffffff22;border-radius:20px;padding:4px 12px;font-weight:800}
#hud .sp{flex:1}
.ic{background:var(--yel);color:var(--navy);border:0;border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;box-shadow:0 3px 0 #c9951a}
#app{max-width:860px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:26px;padding:20px;border:4px solid var(--navy);box-shadow:0 8px 0 var(--navy);margin:12px 0;animation:pop .35s}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
h1{font-size:clamp(26px,6vw,44px);color:var(--navy);line-height:1.3}h2{font-size:clamp(20px,4.5vw,28px);color:var(--navy);margin-bottom:8px}
.btn{display:inline-block;border:0;border-radius:18px;padding:14px 26px;font:800 20px inherit;font-family:inherit;color:#fff;background:var(--grn);box-shadow:0 6px 0 #1b9a50;cursor:pointer;margin:6px;transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1b9a50}.btn.b{background:var(--sky);box-shadow:0 6px 0 #1d7fc4}.btn.y{background:var(--yel);color:var(--navy);box-shadow:0 6px 0 #c9951a}.btn.r{background:var(--red);box-shadow:0 6px 0 #c63a40}.btn.p{background:var(--pur);box-shadow:0 6px 0 #6a3fd0}
.hero{display:flex;gap:12px;align-items:center}.hero svg{width:96px;flex:none;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.say{background:#fff8dc;border:3px solid var(--yel);border-radius:20px;padding:12px 16px;font-size:18px;line-height:1.7;font-weight:600;position:relative}
.say:before{content:"";position:absolute;right:-12px;top:30px;border:9px solid transparent;border-left-color:var(--yel);transform:rotate(180deg)}
input[type=text]{width:100%;font:700 20px inherit;font-family:inherit;padding:12px 16px;border-radius:16px;border:3px solid var(--sky);text-align:center;margin:10px 0}
.bar{height:16px;background:#dde7f5;border-radius:10px;overflow:hidden;border:2px solid var(--navy)}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--grn),#8be04e);transition:width .5s}
.map{display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px}
.node{width:46px;height:46px;border-radius:50%;background:#cfd8ea;display:grid;place-items:center;font-size:22px;border:3px solid var(--navy);filter:grayscale(1);opacity:.7}.node.on{filter:none;opacity:1;background:var(--yel);transform:scale(1.15)}.node.dn{filter:none;opacity:1;background:var(--grn)}
.line{flex:1;height:6px;background:#cfd8ea;margin:0 3px;border-radius:4px}.line.dn{background:var(--grn)}
.q{font-size:clamp(19px,4.2vw,25px);font-weight:800;line-height:1.7;margin:10px 0}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:#eef6ff;border:3px solid var(--sky);border-radius:18px;padding:13px 16px;margin:9px 0;font:700 19px inherit;font-family:inherit;color:var(--ink);cursor:pointer;box-shadow:0 5px 0 #9cc9ee;transition:.15s}
.opt:hover:not(:disabled){transform:translateY(-2px);background:#dff0ff}.opt i{font-style:normal;background:var(--sky);color:#fff;border-radius:50%;min-width:34px;height:34px;display:grid;place-items:center}
.opt.ok{background:#d9f9e4;border-color:var(--grn);box-shadow:0 5px 0 #1b9a50}.opt.no{background:#ffe0e1;border-color:var(--red);box-shadow:0 5px 0 #c63a40;animation:shk .4s}
.opt:disabled{cursor:default}
@keyframes shk{25%{transform:translateX(8px)}75%{transform:translateX(-8px)}}
.tf{display:flex;gap:14px}.tf .opt{justify-content:center;font-size:26px;padding:18px}
.imgs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.imgs img{flex:1 1 300px;max-width:100%;border-radius:18px;border:3px solid var(--navy)}
.chips span{display:inline-block;background:#fff3c4;border:2px dashed var(--yel);border-radius:14px;padding:4px 12px;margin:3px;font-weight:700}
.fb{border-radius:20px;padding:14px 18px;margin-top:12px;font-size:19px;line-height:1.7;font-weight:700;animation:pop .3s}.fb.ok{background:#d9f9e4;border:3px solid var(--grn);color:#0d6b35}.fb.no{background:#ffe0e1;border:3px solid var(--red);color:#9a1f25}
.big{font-size:80px;text-align:center;animation:bob 1.6s infinite}
.cert{border:8px double var(--yel);background:#fffdf2;text-align:center;padding:24px;border-radius:20px}.cert h1{color:#b8760a}
.cn{font-size:34px;font-weight:900;color:var(--navy);border-bottom:3px dashed var(--yel);display:inline-block;padding:0 24px;margin:8px}
.bd{display:inline-block;margin:6px;padding:10px 14px;border-radius:18px;background:#fff;border:3px solid var(--yel);font-weight:800}.bd span{font-size:34px;display:block}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:#f1f6ff;margin:6px 0;font-weight:800}.row.me{background:#fff3c4;border:3px solid var(--yel)}.row .n{background:var(--navy);color:#fff;border-radius:50%;min-width:34px;height:34px;display:grid;place-items:center}.row .sp{flex:1}
.modal{position:fixed;inset:0;background:#0008;z-index:9;display:grid;place-items:center;padding:14px}.modal>div{background:#fff;border-radius:24px;border:4px solid var(--navy);padding:18px;max-width:520px;width:100%;max-height:88vh;overflow:auto}
.cf{position:fixed;top:-30px;font-size:26px;animation:fall 2.6s linear forwards;z-index:8;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media print{#hud,.noprint,body:before,body:after{display:none!important}.card{box-shadow:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
button:focus-visible,input:focus-visible{outline:4px solid var(--pur)}
/* ===== إضافات التطوير ===== */
:root{--lc:#2ecc71;--lcd:#1b9a50;--lcl:#eef6ff}
body[data-lv="0"]{--lc:#43d17a;--lcd:#27a05a;--lcl:#e8fbee}
body[data-lv="1"]{--lc:#3b8ff0;--lcd:#1f63b8;--lcl:#e4f0ff}
body[data-lv="2"]{--lc:#8b5cf6;--lcd:#6a3fd0;--lcl:#efe8ff}
body[data-lv="3"]{--lc:#ff6b35;--lcd:#c9431a;--lcl:#ffeadf}
body[data-lv] #hud{border-bottom-color:var(--lc)}
body[data-lv] .card{border-color:var(--lc);box-shadow:0 8px 0 var(--lcd)}
body[data-lv] h1,body[data-lv] h2{color:var(--lcd)}
.btn{background:var(--lc);box-shadow:0 6px 0 var(--lcd);text-shadow:0 1px 2px #0003}
.btn.b{background:var(--sky);box-shadow:0 6px 0 #1d7fc4}.btn.y{background:var(--yel);box-shadow:0 6px 0 #c9951a;text-shadow:none}.btn.r{background:var(--red);box-shadow:0 6px 0 #c63a40}.btn.p{background:var(--pur);box-shadow:0 6px 0 #6a3fd0}
.btn:disabled{opacity:.5;cursor:default}
.bar i{background:linear-gradient(90deg,var(--lc),var(--lcd))}
.bar{position:relative}
.bar u{position:absolute;top:0;bottom:0;left:50%;border-left:3px dashed var(--navy);opacity:.6}
.opt{border-color:var(--lc);background:var(--lcl);box-shadow:0 5px 0 var(--lcd)}
.opt:hover:not(:disabled){background:#fff}
.opt i{background:var(--lc)}
.opt.ok{background:#d9f9e4;border-color:#2ecc71;box-shadow:0 5px 0 #1b9a50}
.opt.ok i{background:#2ecc71}
.opt.no{background:#ffe0e1;border-color:var(--red);box-shadow:0 5px 0 #c63a40}
.opt.win{animation:ring .9s ease-out 3}
@keyframes ring{0%{box-shadow:0 5px 0 #1b9a50,0 0 0 0 #2ecc71aa}100%{box-shadow:0 5px 0 #1b9a50,0 0 0 18px #2ecc7100}}
.node{background:#cfd8ea}
.node.dn,.node.on{background:var(--c,#ffc52e)}
.node.on{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--c,#ffc52e)}
.line.dn{background:var(--c,var(--grn))}
input[type=text]{border-color:var(--lc)}
#hud .hp.warn{background:var(--red);animation:pulse .6s infinite}
.dfc{display:inline-block;background:var(--lc);color:#fff;border-radius:14px;padding:2px 12px;font-weight:800;font-size:16px;text-shadow:0 1px 2px #0003}
.think{font-weight:700;font-size:15px;color:var(--lcd);margin:4px 0}
.qh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;flex-wrap:wrap}
.timer{display:flex;align-items:center;gap:12px;margin:10px 0}
.tcirc{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:900;color:#fff;background:var(--lc);border:4px solid var(--navy);flex:none;text-shadow:0 1px 2px #0004}
.tcirc.warn{background:var(--red);animation:pulse .6s infinite}
.tbar{flex:1;height:18px;background:#dde7f5;border-radius:10px;border:2px solid var(--navy);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--lc);transition:width .25s linear}
.tbar i.warn{background:var(--red)}
@keyframes pulse{50%{transform:scale(1.1)}}
.praise{font-size:22px;font-weight:900;margin-bottom:4px}
.lvhead{display:flex;gap:14px;align-items:center;margin:14px 0 6px}
.lvbig{width:70px;height:70px;border-radius:50%;background:var(--lc);display:grid;place-items:center;font-size:36px;border:4px solid var(--lcd);flex:none}
.inf span{display:inline-block;background:var(--lcl);border:2px solid var(--lc);border-radius:14px;padding:4px 12px;margin:3px;font-weight:700}
.ins{background:#f6faff;border:3px solid #cfe3f7;border-radius:16px;padding:10px 14px;margin:9px 0;line-height:1.9;font-weight:600}
.ins b{color:var(--navy)}
.lvrow{display:flex;gap:10px;align-items:center;border:3px solid var(--lc);background:#fff;border-radius:16px;padding:8px 12px;margin:6px 0;line-height:1.6}
.lvi{background:var(--lc);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.st{background:var(--lcl);border:3px solid var(--lc);border-radius:18px;padding:10px 6px;text-align:center;font-weight:800;line-height:1.4}
.st b{display:block;font-size:26px;color:var(--navy)}.st small{font-size:14px;color:#456;font-weight:700}
.banner{border-radius:20px;padding:14px 16px;margin:10px 0;font-size:19px;line-height:1.8;font-weight:800;text-align:center}
.banner.pass{background:#d9f9e4;border:4px solid #2ecc71;color:#0d6b35}
.banner.fail{background:#fff0d9;border:4px solid #ff9f1c;color:#8a4b00}
.sec{font-size:22px;font-weight:900;margin:16px 0 6px;padding:6px 14px;border-radius:14px}
.sec.g{background:#d9f9e4;color:#0d6b35;border:3px solid #2ecc71}.sec.rd{background:#ffe0e1;color:#9a1f25;border:3px solid var(--red)}
.rp{border-radius:16px;padding:10px 14px;margin:8px 0;line-height:1.8;font-weight:700;text-align:right;font-size:17px}
.rp.g{background:#f0fdf4;border:3px solid #2ecc71;border-right-width:10px}
.rp.rd{background:#fff5f5;border:3px solid var(--red);border-right-width:10px}
.rp .qn{font-weight:900}
.rp .gd{color:#0d6b35}.rp .bd2{color:#b3262d}
.rp .ex{color:#33406b;font-weight:600;font-size:16px}
.rp img{max-height:90px;max-width:48%;border-radius:10px;border:2px solid #ccd;margin:2px}
.note{font-weight:700;color:#456;text-align:center;margin:8px 0}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:7}
#fx .pt{position:absolute;line-height:1;will-change:transform,opacity}
/* ===== تطوير الشكل البصري وهوية المستويات ===== */
body{background:radial-gradient(circle at 12% 8%,#ffffff88 0,#fff0 32%),radial-gradient(circle at 88% 92%,#ffd86b88 0,#0000 38%),radial-gradient(#ffffff40 2px,#0000 2.6px) 0 0/34px 34px,linear-gradient(160deg,#79d2ff 0%,#8f86ff 55%,#ff9bd8 100%);background-attachment:fixed}
body:before{content:"✨"}body:after{content:"🚀"}
body[data-lv="0"]{background:radial-gradient(ellipse at 50% 108%,#1f9d58 0,#1f9d5800 55%),radial-gradient(circle at 15% 10%,#ffffffaa 0,#fff0 30%),radial-gradient(#ffffff55 3px,#0000 3.6px) 0 0/46px 46px,linear-gradient(170deg,#c9f9d6,#78e39b 55%,#34b96f);background-attachment:fixed}
body[data-lv="0"]:before{content:"🍃"}body[data-lv="0"]:after{content:"🦋"}
body[data-lv="1"]{background:radial-gradient(ellipse at 50% 112%,#134fa8 0,#134fa800 58%),radial-gradient(circle,#ffffff66 0,#fff0 7px) 0 0/60px 60px,radial-gradient(circle at 85% 8%,#ffffffaa 0,#fff0 28%),linear-gradient(170deg,#cdeeff,#62b8ff 55%,#2271dc);background-attachment:fixed}
body[data-lv="1"]:before{content:"🫧"}body[data-lv="1"]:after{content:"🐠"}
body[data-lv="2"]{background:radial-gradient(#ffffffcc 1.5px,#0000 2px) 0 0/52px 52px,radial-gradient(#ffffff77 1px,#0000 1.6px) 20px 26px/37px 37px,radial-gradient(circle at 80% 12%,#ffffff55 0,#fff0 30%),linear-gradient(170deg,#6a45d6,#5632b8 45%,#2c1a78);background-attachment:fixed}
body[data-lv="2"]:before{content:"🌙"}body[data-lv="2"]:after{content:"🔮"}
body[data-lv="3"]{background:radial-gradient(ellipse at 50% 112%,#d9501a 0,#d9501a00 55%),radial-gradient(circle at 18% 8%,#fff3c4cc 0,#fff0 28%),radial-gradient(#ffffff44 3px,#0000 3.6px) 0 0/50px 50px,linear-gradient(170deg,#ffe2bd,#ffa75f 55%,#ea6a22);background-attachment:fixed}
body[data-lv="3"]:before{content:"☀️"}body[data-lv="3"]:after{content:"🔥"}
body:before,body:after{opacity:.5;z-index:0}
#app{position:relative;z-index:1}
#hud{background:linear-gradient(90deg,#1b2a6b,#3a3fb5);box-shadow:0 4px 14px #0003}
body[data-lv] #hud{background:linear-gradient(90deg,var(--lcd),#1b2a6b)}
.card{background:linear-gradient(180deg,#fff,#f8fbff);border-radius:30px;position:relative;overflow:hidden}
body[data-lv] .card{background:linear-gradient(180deg,var(--lcl),#fff 140px)}
.card:after{position:absolute;bottom:-14px;left:-8px;font-size:96px;opacity:.1;pointer-events:none;line-height:1}
body:not([data-lv]) .card:after{content:"🎮"}
body[data-lv="0"] .card:after{content:"🌿"}body[data-lv="1"] .card:after{content:"🌊"}body[data-lv="2"] .card:after{content:"⭐"}body[data-lv="3"] .card:after{content:"🔥"}
.btn.btn{border-radius:22px;background-image:linear-gradient(180deg,#ffffff45,#0000 55%)}
.opt{border-radius:20px}
.hero svg.robot{width:118px}
.rb-head{transform-origin:60px 88px;animation:tilt 3.2s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.rb-eye{transform-origin:60px 55px;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.rb-ant{transform-origin:60px 8px;animation:glow 1.1s ease-in-out infinite alternate}
@keyframes glow{from{transform:scale(.8);opacity:.7}to{transform:scale(1.25);opacity:1}}
.rb-arm{transform-origin:94px 96px;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
.edu{border:3px solid var(--lc);background:linear-gradient(135deg,var(--lcl),#fff);border-radius:22px;padding:12px 16px 14px;margin:14px 0;position:relative;z-index:1}
.edu h3{color:var(--lcd);font-size:clamp(18px,4.2vw,22px);margin-bottom:6px}
.edu p{line-height:1.9;font-weight:600;font-size:17px}
.edu .kp{margin-top:8px}.edu .kp span{display:inline-block;background:#fff;border:2px solid var(--lc);border-radius:14px;padding:4px 12px;margin:3px;font-weight:800;font-size:15px;color:var(--lcd)}

/* ===== تحديث: صفحة التعليمات + لوحة الصدارة + لمسات جمالية ===== */
@keyframes pageIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.card{animation:pageIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.94)}to{opacity:1;transform:none}}
.modal{animation:fadeIn .25s}.modal>div{animation:modalIn .35s cubic-bezier(.2,.8,.2,1)}
.btn{transition:transform .15s,box-shadow .15s,filter .15s}
.btn:hover:not(:disabled){transform:translateY(-3px);filter:brightness(1.06)}
.btn:active{transform:translateY(4px)}
.ic{transition:transform .15s}.ic:hover{transform:scale(1.12) rotate(-6deg)}
input[type=text]{transition:box-shadow .2s,border-color .2s}input[type=text]:focus{outline:0;box-shadow:0 0 0 5px #ffc52e66}
/* --- صفحة التعليمات --- */
.ih{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.irobot{position:relative;flex:none;width:150px}
.irobot svg.robot{width:100%;display:block;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 8px 10px #1b2a6b33)}
.irobot .sp1,.irobot .sp2,.irobot .sp3{position:absolute;font-size:20px;animation:twinkle 2.2s ease-in-out infinite;pointer-events:none}
.irobot .sp1{top:2px;left:0}.irobot .sp2{top:36px;right:-4px;animation-delay:.7s;font-size:16px}.irobot .sp3{bottom:20px;left:-6px;animation-delay:1.3s;font-size:15px}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(25deg)}}
.ibub{position:relative;flex:1;background:linear-gradient(135deg,#fffbe6,#fff2b8);border:4px solid var(--yel);border-radius:26px;padding:14px 18px;font-size:clamp(16px,3.6vw,20px);line-height:1.8;font-weight:800;color:var(--navy);box-shadow:0 6px 0 #e0a916;animation:pop .6s .15s both}
.ibub:before{content:"";position:absolute;right:-13px;top:38px;width:20px;height:20px;background:#fff7cf;border-top:4px solid var(--yel);border-right:4px solid var(--yel);transform:rotate(45deg);border-radius:0 5px 0 0}
.ibub b{color:#d4531a}
.ititle{text-align:center;margin:16px 0 4px;font-size:clamp(28px,6.5vw,42px);font-weight:900;line-height:1.3}.ititle .gt{background:linear-gradient(90deg,#3b8ff0,#8b5cf6 40%,#ff6b35 80%);-webkit-background-clip:text;background-clip:text;color:transparent}
.isub{text-align:center;font-weight:700;color:#5a6690;margin-bottom:10px}
.ihd{display:flex;align-items:center;gap:10px;margin:22px 0 12px;font-size:clamp(20px,4.6vw,26px);font-weight:900;color:var(--navy)}
.ihd i{font-style:normal;display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--hc,var(--yel));box-shadow:0 4px 0 var(--hd,#c9951a);font-size:24px;flex:none}
.ihd:after{content:"";flex:1;height:5px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--yel) 0 14px,#0000 14px 24px);opacity:.75}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ic2{position:relative;background:#fff;border:3px solid var(--ac);border-radius:22px;padding:14px 16px 14px;box-shadow:0 6px 0 var(--ac);transition:transform .2s,box-shadow .2s;animation:pop .5s backwards;animation-delay:calc(var(--i)*70ms + 150ms);overflow:hidden}
.ic2:before{content:"";position:absolute;inset:0 0 auto 0;height:7px;background:var(--ac)}
.ic2:hover{transform:translateY(-4px);box-shadow:0 10px 0 var(--ac)}
.ic2.wide{grid-column:1/-1}
.ic2 .ct{display:flex;align-items:center;gap:10px;margin:6px 0 6px}
.ic2 .ci{width:48px;height:48px;border-radius:50%;background:var(--ac);display:grid;place-items:center;font-size:25px;flex:none;box-shadow:inset 0 -4px 0 #0002,0 3px 0 #0002}
.ic2 h3{font-size:clamp(17px,4vw,21px);color:var(--ac2,var(--ac));filter:brightness(.82)}
.ic2 p{line-height:1.95;font-weight:600;font-size:16.5px}
.ic2 p b{color:var(--navy)}
.lvg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lvc{position:relative;background:linear-gradient(180deg,#fff,#fff 60%,color-mix(in srgb,var(--lc) 12%,#fff));border:3px solid var(--lc);border-radius:22px;padding:14px;box-shadow:0 6px 0 var(--lcd);animation:pop .5s backwards;animation-delay:calc(var(--i)*90ms + 400ms);transition:transform .2s}
.lvc:hover{transform:translateY(-4px) rotate(-.6deg)}
.lvc .top{display:flex;gap:12px;align-items:center}
.lvc .num{position:relative;width:62px;height:62px;border-radius:50%;background:var(--lc);display:grid;place-items:center;font-size:32px;border:4px solid var(--lcd);flex:none;box-shadow:0 4px 0 #0002}
.lvc .num em{position:absolute;top:-8px;right:-8px;font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:14px;font-weight:900;display:grid;place-items:center;border:2px solid #fff}
.lvc b{display:block;font-size:clamp(16px,3.8vw,19px);line-height:1.5;color:var(--navy)}
.lvc .dfc{font-size:14px;margin-top:2px}
.lvc .chs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lvc .chs span{background:#fff;border:2px solid var(--lc);border-radius:12px;padding:3px 10px;font-weight:800;font-size:14.5px;color:var(--navy)}
.lvc .chs span.need{background:color-mix(in srgb,var(--lc) 18%,#fff)}
.ok-wrap{text-align:center;margin:24px 0 6px}
.btn.cta{font-size:clamp(20px,5vw,26px);padding:18px 38px;border-radius:26px;background:linear-gradient(180deg,#ffd84d,#ffb300);color:var(--navy);box-shadow:0 8px 0 #c98400,0 14px 24px #c9840055;text-shadow:none;position:relative;overflow:hidden;animation:ctaPulse 1.8s ease-in-out infinite}
.btn.cta:after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-90px;background:linear-gradient(100deg,#fff0,#fff9,#fff0);transform:skewX(-20deg);animation:shine 2.8s ease-in-out infinite}
.btn.cta:active{box-shadow:0 3px 0 #c98400;animation:none}
@keyframes ctaPulse{50%{transform:scale(1.045)}}
@keyframes shine{0%,55%{left:-90px}100%{left:130%}}
@media(max-width:620px){
 .igrid,.lvg{grid-template-columns:1fr}
 .irobot{width:96px}.ih{gap:12px}.ibub{padding:10px 12px;border-width:3px;border-radius:20px}.ibub:before{top:30px;width:16px;height:16px;right:-10px;border-width:3px}
 .ic2 p{font-size:16px}
}
/* --- لوحة الصدارة --- */
.crown{display:inline-block;width:30px;height:23px;vertical-align:middle;filter:drop-shadow(0 2px 0 #0003);animation:crownFloat 2.2s ease-in-out infinite}
.crown.lg{width:92px;height:69px}
@keyframes crownFloat{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-4px) rotate(5deg)}}
.row{transition:transform .2s}
.row .n.g1{background:linear-gradient(135deg,#ffe066,#ffb300);color:var(--navy);box-shadow:0 0 0 3px #fff,0 0 0 5px #ffb300}
.row .n.g2{background:linear-gradient(135deg,#f1f4f9,#aab4c4);color:var(--navy)}
.row .n.g3{background:linear-gradient(135deg,#f2c196,#c27a3a);color:#fff}
.row.first{background:linear-gradient(100deg,#fff3b0,#ffd95a 50%,#fff3b0);background-size:200% 100%;border:3px solid #ffb300;animation:goldSlide 3.5s linear infinite}
@keyframes goldSlide{to{background-position:-200% 0}}
.row.me{border:3px solid var(--yel)}
.row.fresh{animation:newRow 1.1s cubic-bezier(.2,.8,.2,1) both}
.row.first.fresh{animation:newRow 1.1s cubic-bezier(.2,.8,.2,1) both,goldSlide 3.5s linear infinite}
@keyframes newRow{0%{opacity:0;transform:translateX(-40px) scale(.9)}60%{transform:translateX(6px) scale(1.03);box-shadow:0 0 0 6px #ffc52e88}100%{opacity:1;transform:none;box-shadow:0 0 0 0 #ffc52e00}}
.row .nm{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .sc{font-size:18px;color:var(--navy);white-space:nowrap}
.rank-card{text-align:center;position:relative}
.rank-card .rk{display:inline-flex;flex-direction:column;align-items:center;gap:2px;margin:6px 0 8px;padding:10px 30px 12px;border-radius:26px;background:linear-gradient(180deg,#fff6c9,#ffe27a);border:4px solid #ffb300;box-shadow:0 7px 0 #c98400;animation:rkPop .8s cubic-bezier(.2,1.4,.4,1) both}
.rank-card .rk.top{background:linear-gradient(180deg,#fff2a8,#ffc929);animation:rkPop .8s cubic-bezier(.2,1.4,.4,1) both,rkGlow 1.6s ease-in-out .8s infinite}
@keyframes rkPop{from{opacity:0;transform:scale(.4) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes rkGlow{50%{box-shadow:0 7px 0 #c98400,0 0 38px 8px #ffd54a}}
.rank-card .rn{font-size:clamp(46px,12vw,72px);font-weight:900;color:var(--navy);line-height:1}
.rank-card .rl{font-size:clamp(20px,5vw,28px);font-weight:900;color:#b8760a}
.rank-card .rs{font-weight:800;font-size:18px}
.rank-card .mini{text-align:right;margin-top:12px}
.rank-card .mini .row{margin:6px 0}
.note.s{font-size:14px;color:#456}
.row .nm{min-width:0;overflow-wrap:anywhere}.row small{font-weight:700;color:#456;font-size:13px;max-width:36%;line-height:1.3;text-align:left}
.rank-card:not(.in) .rk,.rank-card:not(.in) .row.fresh{animation:none;opacity:0}
.rank-card .hero{text-align:right;margin-bottom:6px}
/* --- أسئلة الصورتين: اختيار بالضغط على الصورة --- */
.pics{display:flex;flex-wrap:nowrap;gap:12px;align-items:stretch;margin:8px 0}
.pic{position:relative;flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;background:#fff;border:4px solid var(--lc);border-radius:22px;padding:8px;cursor:pointer;box-shadow:0 6px 0 var(--lcd);transition:transform .15s,box-shadow .15s,background .15s;font-family:inherit}
.pic img{display:block;width:100%;height:auto;max-height:340px;object-fit:contain;border-radius:14px}
.pic .lb{position:absolute;top:-14px;right:-8px;min-width:46px;height:46px;padding:0 10px;border-radius:23px;background:var(--lc);color:#fff;font:900 22px inherit;font-family:inherit;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 3px 0 var(--lcd);text-shadow:0 1px 2px #0004;z-index:2}
.pic:hover:not(:disabled){transform:translateY(-4px);box-shadow:0 10px 0 var(--lcd);background:var(--lcl)}
.pic:active:not(:disabled){transform:translateY(3px)}
.pic:disabled{cursor:default}
.pic.ok{border-color:#2ecc71;background:#d9f9e4;box-shadow:0 6px 0 #1b9a50}.pic.ok .lb{background:#2ecc71;box-shadow:0 3px 0 #1b9a50}
.pic.no{border-color:var(--red);background:#ffe0e1;box-shadow:0 6px 0 #c63a40;animation:shk .4s}.pic.no .lb{background:var(--red);box-shadow:0 3px 0 #c63a40}
.pic.win{animation:ring .9s ease-out 3}
.pic:focus-visible{outline:4px solid var(--pur)}
@media(max-width:520px){.pics{gap:8px}.pic{padding:5px;border-width:3px;border-radius:16px}.pic .lb{min-width:38px;height:38px;font-size:18px;top:-12px}}
</style>
</head>

let AC=null,MG=null,NB=null,PL=[];
function actx(){if(AC)return AC;const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{AC=new C();const cp=AC.createDynamicsCompressor();MG=AC.createGain();MG.gain.value=S.muted?0:1;MG.connect(cp);cp.connect(AC.destination)}catch(e){AC=null}return AC}
function unlock(){if(S.muted)return;const a=actx();if(a&&a.state==='suspended'){try{a.resume()}catch(e){}}}
['pointerdown','touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
function stopAll(){PL.forEach(n=>{try{n.stop()}catch(e){}});PL=[]}
function setMute(m){S.muted=m;save();if(m){stopAll();if(MG)MG.gain.value=0}else{if(MG)MG.gain.value=1;unlock();tone(880,0,.15,'triangle',.15)}hud()}
function tone(f,t,d,type,v){const a=actx();if(!a||S.muted)return;try{const o=a.createOscillator(),g=a.createGain(),s=a.currentTime+t;o.type=type||'sine';o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v||.2,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(MG);o.start(s);o.stop(s+d+.05);PL.push(o);o.onended=()=>{PL=PL.filter(x=>x!==o)}}catch(e){}}
function clap(dur,n,vol){const a=actx();if(!a||S.muted)return;try{if(!NB){NB=a.createBuffer(1,Math.floor(a.sampleRate*.6),a.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
const t0=a.currentTime;for(let i=0;i<n;i++){const st=t0+Math.random()*dur,fade=Math.max(.1,1-(st-t0)/(dur*1.15)),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=NB;f.type='bandpass';f.frequency.value=900+Math.random()*3200;f.Q.value=.7;g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(vol*fade*(.5+Math.random()*.5),st+.004);g.gain.exponentialRampToValueAtTime(.0001,st+.08);s.connect(f);f.connect(g);g.connect(MG);s.start(st,Math.random()*.4,.1);PL.push(s);s.onended=()=>{PL=PL.filter(x=>x!==s)}}}catch(e){}}

let MEMB=null; // نسخة احتياطية في الذاكرة إن تعذّر التخزين المحلي
function realBoard(){let b=null;try{b=JSON.parse(localStorage.getItem(BK))}catch(e){}
 if(!Array.isArray(b))b=MEMB||[];
 const out=[];b.forEach((x,i)=>{if(!x||typeof x.n!=='string'||!(x.s>=0))return;
  if(x.id)out.push(x);                                                       // التنسيق الجديد
  else if(x.me&&x.t==='أسطورة اللعب الآمن'&&x.s>0)out.push({id:'old'+i+'_'+x.n,n:x.n,s:x.s,t:x.t,ts:0}); // تنسيق قديم: نحتفظ فقط بمن أتمّ الرحلة
 });return out}
function writeBoard(b){MEMB=b;try{localStorage.setItem(BK,JSON.stringify(b))}catch(e){}}
function allBoard(){const l=realBoard().concat(SHOW_SAMPLES?SAMPLES:[]).map(x=>Object.assign({},x));
 l.sort((a,b)=>b.s-a.s||(a.ex?1:0)-(b.ex?1:0)||(a.ts||0)-(b.ts||0));
 l.forEach(x=>{x.r=1+l.filter(y=>y.s>x.s).length});return l}

function tick(){
 if(cur.done){stopTimer();return}
 const ms=dl-Date.now(),s=Math.max(0,Math.ceil(ms/1000)),w=s<=10;
 const n=$('#tNum'),b=$('#tBar'),h=$('#hT'),hp=$('#hTime');
 if(n){n.textContent=s;n.classList.toggle('warn',w)}
 if(b){b.style.width=Math.max(0,ms/(SEC*10))+'%';b.classList.toggle('warn',w)}
 if(h)h.textContent=s;if(hp)hp.classList.toggle('warn',w);
 if(ms<=0)onTimeout();
}
function pauseTimer(){if(tmr&&!pausedAt){pausedAt=Date.now();clearInterval(tmr);tmr=null}}

/* ===== بطاقة المستوى ===== */
function intro(){guard();stopTimer();cur.done=true;const lv=S.lv,l=LV[lv],n=l.qs.length;theme(lv);hud();
 app.innerHTML='<div class="card">'+map()+hero(l.say)+'<div class="lvhead"><div class="lvbig">'+l.ic+'</div><div><h2 style="margin:0">المستوى '+(lv+1)+': '+l.n+'</h2><span class="dfc">'+DIFF[lv][0]+' '+DIFF[lv][1]+'</span></div></div><div class="inf"><span>🧠 '+THINK[lv]+'</span><span>🎯 '+n+' أسئلة</span><span>⭐ '+l.pts+' نقطة</span><span>❤️ '+maxH(lv)+' قلوب</span><span>⏱ '+secOf(lv)+' ثانية لكل سؤال</span><span>✅ للنجاح: '+need(n)+' إجابات صحيحة على الأقل</span><span>🏅 الشارة: '+l.bd+'</span></div>'+eduBox(lv)+'<div style="text-align:center;margin-top:8px"><button class="btn" id="st">ابدأ التحدي ▶</button></div></div>';
 $('#st').onclick=question;window.scrollTo(0,0)}

/* ===== السؤال ===== */
const nz=s=>s.replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ئ/g,'ي').replace(/ؤ/g,'و').replace(/[^\u0621-\u064Aa-z0-9 ]/gi,' ').replace(/\s+/g,' ').trim();
const rightOf=q=>q.t=='mc'?q.o[q.a]:q.t=='tf'?(q.a?'صح':'خطأ'):q.ans;
const PL_AB=['أ','ب'];
const picName=(q,ord)=>'الصورة ('+PL_AB[Math.max(0,ord.indexOf(q.c))]+')';   // اسم الصورة الصحيحة حسب ترتيب ظهورها
const rightTxt=(q,ord)=>q.t=='img'?picName(q,ord||q.img):rightOf(q);
function question(){guard();const lv=S.lv,l=LV[lv],R=S.run;theme(lv);
 if(R.fin)return result(false);
 if(R.hearts<=0||R.q>=l.qs.length){finishRun();return result(false)}
 hud();const q=l.qs[R.q];cur={qi:R.q,done:false};
 let h='<div class="card">'+map()+'<div class="qh"><span class="dfc">المستوى '+(lv+1)+' · '+DIFF[lv][0]+' '+DIFF[lv][1]+'</span><span>سؤال '+(R.q+1)+' من '+l.qs.length+'</span></div><div class="think">🧠 نوع التفكير: '+THINK[lv]+'</div><div class="bar"><i style="width:'+(R.q/l.qs.length*100)+'%"></i></div><div class="timer" aria-label="الوقت المتبقي"><div class="tcirc" id="tNum">'+secOf(lv)+'</div><div class="tbar"><i id="tBar"></i></div></div>';
 if(q.img&&q.t!='img')h+='<div class="imgs" style="margin-top:12px">'+q.img.map(k=>'<img src="'+IMG[k]+'" alt="صورة السؤال">').join('')+'</div>';
 h+='<div class="q">'+q.q+'</div><div id="ch"></div><div id="fb" aria-live="polite"></div></div>';app.innerHTML=h;const ch=$('#ch');
 if(q.t=='img'){const ord=q.img.slice().sort(()=>Math.random()-.5);cur.ord=ord;   // ترتيب الصورتين عشوائي كما تُخلط الاختيارات في بقية الأسئلة
  ch.innerHTML='<div class="pics">'+ord.map((k,j)=>'<button class="pic" data-k="'+k+'" aria-label="صورة التصرف ('+PL_AB[j]+')"><span class="lb">('+PL_AB[j]+')</span><img src="'+IMG[k]+'" alt="صورة التصرف ('+PL_AB[j]+')"></button>').join('')+'</div>';
  ch.querySelectorAll('.pic').forEach((b,j)=>b.onclick=()=>{answer(b.dataset.k===q.c,'الصورة ('+PL_AB[j]+')',b)})}
 else if(q.t=='tf'){ch.innerHTML='<div class="tf"><button class="opt" data-v="1"><i>✔</i>صح</button><button class="opt" data-v="0"><i style="background:var(--red)">✖</i>خطأ</button></div>';ch.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const v=b.dataset.v=='1';answer(v===q.a,v?'صح':'خطأ',b)})}
 else if(q.t=='mc'){const ix=q.o.map((_,i)=>i).sort(()=>Math.random()-.5);ch.innerHTML=ix.map((i,k)=>'<button class="opt" data-i="'+i+'"><i>'+'أبجد'[k]+'</i>'+q.o[i]+'</button>').join('');ch.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;answer(i===q.a,q.o[i],b)})}
 else{ch.innerHTML='<div class="chips">كلمات مساعدة: '+q.hint.map(x=>'<span>'+x+'</span>').join('')+'</div><input type="text" id="fa" placeholder="اكتب إجابتك هنا" autocomplete="off"><div style="text-align:center"><button class="btn" id="cf">تأكيد ✔</button></div>';
  const go=()=>{if(cur.done)return;const v=$('#fa').value;if(!v.trim()){$('#fa').focus();return}const n=nz(v),ok=q.ok.some(k=>{k=nz(k);return n==k||(n.includes(k)&&n.length<=k.length+14)});answer(ok,v.trim(),null)};$('#cf').onclick=go;$('#fa').onkeydown=e=>{if(e.key=='Enter')go()}}
 window.scrollTo(0,0);startTimer()}
function answer(ok,chosen,btn){if(cur.done||cur.qi!==S.run.q)return;cur.done=true;stopTimer();record(ok?'ok':'no',chosen,btn)}
function onTimeout(){if(cur.done||cur.qi!==S.run.q)return;cur.done=true;stopTimer();record('time',null,null)}
const OKP=['أحسنت يا بطل! 🌟','ممتاز! إجابة صحيحة ✅','رائع! أنت تتقدم بسرعة 🚀','برافو! استمر 👏','عمل مذهل! 🎉','فكرة ذكية، أنت نجم اللعبة! ⭐'];
function record(st,chosen,btn){
 const lv=S.lv,l=LV[lv],R=S.run,qi=R.q,q=l.qs[qi];
 if(R.rec.some(r=>r.qi===qi))return;                 // منع الاحتساب مرتين
 const ok=st==='ok';const rc={qi,st,ch:chosen};if(q.t=='img')rc.ord=(cur.ord||q.img).slice();R.rec.push(rc);if(ok)R.corr++;else R.hearts--;R.q++;
 const last=R.hearts<=0||R.q>=l.qs.length;if(last)finishRun();else save();
 hud();
 const box=$('#ch');if(!box)return;
 box.querySelectorAll('button').forEach(b=>{b.disabled=true;if(q.t=='mc'&&+b.dataset.i===q.a)b.classList.add('ok');if(q.t=='tf'&&(b.dataset.v=='1')===q.a)b.classList.add('ok');if(q.t=='img'&&b.dataset.k===q.c)b.classList.add('ok')});
 const fa=$('#fa');if(fa)fa.disabled=true;
 if(btn&&!ok)btn.classList.add('no');
 const target=ok?(btn||fa||$('#fb')):null;
 if(ok&&btn)btn.classList.add('win');
 const pt=Math.round(per(lv)),nm=esc(S.name);let msg;
 if(ok)msg='<div class="praise">'+OKP[Math.floor(Math.random()*OKP.length)]+'</div>⭐ حصلت على +'+pt+' نقطة<br>💡 لماذا هي صحيحة؟ '+q.e;
 else msg=(st==='time'?'<div class="praise">⏰ انتهى الوقت يا '+nm+'!</div>لم تُجب عن السؤال في الوقت المحدد فاحتُسب خطأ.':'<div class="praise">🤍 ليست هذه الإجابة الصحيحة هذه المرة يا '+nm+'</div>لا بأس، فالخطأ يساعدنا على التعلّم!')+'<br>✅ الإجابة الصحيحة: <b>'+esc(rightTxt(q,cur.ord))+'</b><br>💡 لماذا هي صحيحة؟ '+q.e+'<br>💔 فقدت قلبًا'+(R.hearts>0?' (بقي لك '+R.hearts+')':' ولم يبق لك قلوب');
 $('#fb').innerHTML='<div class="fb '+(ok?'ok':'no')+'">'+msg+'</div><div style="text-align:center;margin-top:8px"><button class="btn" id="nx">'+(last?'عرض نتيجة المستوى 🏁':'السؤال التالي ◀')+'</button></div>';
 sfx(ok?'ok':'no');if(ok)burst(target);
 $('#nx').onclick=()=>{if(last)result(true);else question()};
 setTimeout(()=>{const n=$('#nx');if(n)n.scrollIntoView({behavior:'smooth',block:'center'})},ok?450:60)}

/* ===== نهاية المحاولة وحساب النتيجة الفعلية ===== */
function finishRun(){const R=S.run,i=S.lv,st=stats(R,i);R.fin=true;R.corr=st.corr;const b=S.best[i];if(!b||st.corr>b.corr)S.best[i]={corr:st.corr,wrong:st.wrong,n:st.n,pct:st.pct,pts:st.pts};if(st.pass)S.passed[i]=true;save()}
function repCard(r,l,good){const q=l.qs[r.qi];let h='<div class="rp '+(good?'g':'rd')+'"><span class="qn">'+(good?'✅':'❌')+' سؤال '+(r.qi+1)+':</span> '+q.q;
 if(q.img)h+='<div>'+(r.ord||q.img).map(k=>'<img src="'+IMG[k]+'" alt="">').join('')+'</div>';
 if(good)h+='<br><span class="gd">إجابتك: <b>'+esc(r.ch)+'</b></span>';
 else{h+='<br>'+(r.st==='time'?'<span class="bd2">⏰ لم تتم الإجابة على هذا السؤال (انتهى الوقت)</span>':'<span class="bd2">إجابتك: <b>'+esc(r.ch)+'</b></span>')+'<br><span class="gd">الإجابة الصحيحة: <b>'+esc(rightTxt(q,r.ord))+'</b></span><br><span class="ex">💡 '+q.e+'</span>'}
 return h+'</div>'}
function result(fx){
 stopTimer();cur.done=true;guard();const lv=S.lv,l=LV[lv],R=S.run,s=stats(R,lv),nm=esc(S.name);theme(lv);hud();
 const good=R.rec.filter(r=>r.st==='ok'),bad=R.rec.filter(r=>r.st!=='ok'),last=lv==LV.length-1,b=S.best[lv];
 const msgs=['مغامر شجاع! بدأت رحلتك بقوة.','حارس ماهر! جسمك في أمان بفضلك.','بطل حقيقي! أمّنت نفسك ومعلوماتك.','أسطورة اللعب الآمن! أتممت الرحلة كاملة.'];
 let h='<div class="card" style="text-align:center"><div class="big">'+(s.pass?l.ic:'💪')+'</div><h1>'+(s.pass?'اجتزت المستوى '+(lv+1)+'!':'نتيجة المستوى '+(lv+1))+'</h1><span class="dfc">'+DIFF[lv][0]+' '+DIFF[lv][1]+'</span>';
 h+=s.pass?'<div class="banner pass">🎉 مبروك يا '+nm+'! لقد اجتزت المستوى بنجاح.<br>'+msgs[lv]+'<br><span class="bd" style="display:inline-block;margin-top:6px"><span>'+l.ic+'</span>شارة: '+l.bd+'</span></div>'
  :'<div class="banner fail">💪 أحسنت المحاولة يا '+nm+'، لكنك لم تجتز المستوى بعد.<br>تحتاج إلى <b>'+need(s.n)+'</b> إجابات صحيحة على الأقل (أكثر من 50%) وحصلت على <b>'+s.corr+'</b>.<br>راجع أخطاءك في الأسفل ثم أعد المحاولة، أنت قادر على ذلك!</div>';
 h+='<div class="stats"><div class="st">👤<b>'+nm+'</b><small>اسم اللاعب</small></div><div class="st">'+l.ic+'<b style="font-size:17px">'+l.n+'</b><small>المستوى '+(lv+1)+' · '+DIFF[lv][0]+'</small></div><div class="st">🎯<b>'+s.corr+' / '+s.n+'</b><small>الدرجة النهائية</small></div><div class="st">📊<b>'+s.pct+'%</b><small>نسبة النجاح (المطلوب أكثر من 50%)</small></div><div class="st">✅<b style="color:#0d6b35">'+s.corr+'</b><small>إجابات صحيحة</small></div><div class="st">❌<b style="color:#b3262d">'+s.wrong+'</b><small>إجابات خاطئة</small></div><div class="st">⭐<b>'+s.pts+' / '+l.pts+'</b><small>النقاط التي جمعتها</small></div><div class="st">❤️<b>'+s.hearts+' / '+maxH(lv)+'</b><small>القلوب المتبقية</small></div></div>';
 h+='<div class="bar" style="margin:6px 0"><i style="width:'+s.pct+'%"></i><u></u></div><p class="note">الخط المتقطع يمثل 50% (حد النجاح)</p>';
 if(!s.pass&&b&&b.corr>s.corr)h+='<p class="note">🏆 أفضل نتيجة لك في هذا المستوى: '+b.corr+' من '+b.n+' ('+b.pct+'%)</p>';
 if(s.answered<s.n)h+='<p class="note">💔 انتهت قلوبك بعد '+s.answered+' من '+s.n+' أسئلة، فلم تصل إلى '+(s.n-s.answered)+' سؤال.</p>';
 h+='<div style="text-align:right"><div class="sec g">✅ إجاباتك الصحيحة ('+good.length+')</div>'+(good.length?good.map(r=>repCard(r,l,true)).join(''):'<p class="note">لا توجد إجابات صحيحة في هذه المحاولة. لا تقلق، ستتحسن!</p>')
  +'<div class="sec rd">❌ الأخطاء التي وقعت فيها ('+bad.length+')</div>'+(bad.length?bad.map(r=>repCard(r,l,false)).join(''):'<p class="note">🌟 لا توجد أخطاء! أداء مثالي.</p>')+'</div>';
 h+='<div class="noprint" style="margin-top:12px">'+(s.pass?'<button class="btn" id="nl">'+(last?'🎓 احصل على شهادتك':'انتقل إلى المستوى التالي ▶')+'</button>':'<button class="btn r" id="rt">🔁 أعد المحاولة</button>')+'</div></div>';
 app.innerHTML=h;window.scrollTo(0,0);
 if(s.pass){$('#nl').onclick=nextLevel;if(fx){sfx('lvl');confetti()}}else{$('#rt').onclick=retry;if(fx)sfx('no')}}
function nextLevel(){const lv=S.lv;if(!S.run.fin||!S.passed[lv]||!stats(S.run,lv).pass)return;   // لا انتقال بدون تحقيق شرط النجاح
 if(lv>=LV.length-1){S.done=true;save();cert();return}
 S.lv=lv+1;S.run=mkRun(S.lv);save();intro()}
function retry(){const lv=S.lv;if(!S.run.fin||stats(S.run,lv).pass)return;S.run=mkRun(lv);save();hud();intro()}
function rankCard(rs){
 const b=allBoard(),me=b.find(x=>x.id===S.pid)||{id:S.pid,n:S.name,s:total(),t:titleOf(),r:1},top=me.r===1,nm=esc(S.name),fid=rs.isNew?S.pid:null;let msg;
 if(top)msg='مبروك يا <b>'+nm+'</b>! 🎉 أنت الآن في <b>المركز الأول</b> في لوحة المتصدرين!';
 else if(me.r<=3)msg='رائع يا <b>'+nm+'</b>! 🎉 سُجّلت نتيجتك وأصبحت في <b>المركز '+ORD[me.r]+'</b> في لوحة المتصدرين.';
 else msg='أحسنت يا <b>'+nm+'</b>! سُجّلت نتيجتك في لوحة المتصدرين، وترتيبك الآن <b>'+me.r+'</b>.';
 const list=b.slice(0,5);let rows=list.map(x=>rowHtml(x,S.pid,fid)).join('');
 if(!list.some(x=>x.id===me.id))rows+='<p class="note" style="margin:2px">⋯</p>'+rowHtml(me,S.pid,fid);
 return '<div class="card rank-card noprint" id="rkc">'+robotHero(msg)+'<div class="rk'+(top?' top':'')+'">'+(top?CROWN.replace('class="crown"','class="crown lg"'):'<span style="font-size:46px;line-height:1.1">'+(me.r<=3?['','🥇','🥈','🥉'][me.r]:'🏅')+'</span>')+'<div class="rn">'+me.r+'</div><div class="rl">المركز '+(ORD[me.r]||me.r)+'</div><div class="rs">👤 '+nm+' · ⭐ '+me.s+' نقطة</div></div><p class="note">عدد الأسماء في لوحة المتصدرين: '+b.length+'</p><div class="mini">'+rows+'</div><div style="margin-top:10px"><button class="btn p" id="lb3">🏅 لوحة المتصدرين كاملة</button><button class="btn" id="ng">🚀 ابدأ لعبة جديدة</button></div></div>'}
function cert(){stopTimer();cur.done=true;theme(null);hud();const rs=addScore();confetti();sfx('win');const pct=total();app.innerHTML='<div class="noprint" style="text-align:center"><button class="btn y" id="gr">🏆 شاهد ترتيبك في لوحة المتصدرين ⬇</button></div><div class="card cert"><div style="font-size:60px">🎓</div><h1>شهادة إتمام الرحلة</h1><p style="font-size:20px;font-weight:700">تشهد رحلة بطل اللعب الآمن بأن البطل</p><div class="cn">'+esc(S.name)+'</div><p style="font-size:20px;font-weight:700">قد أتم المستويات الأربعة وأصبح <b>'+titleOf()+'</b></p><p style="font-size:24px;font-weight:900;margin:10px">⭐ مجموع النقاط: '+pct+' من 1000</p><div>'+LV.map((l,i)=>S.passed[i]?'<div class="bd" style="border-color:'+COL[i]+'"><span>'+l.ic+'</span>'+l.bd+'<br><small>'+(S.best[i]?S.best[i].corr+' / '+S.best[i].n+' · '+S.best[i].pct+'%':'')+'</small></div>':'').join('')+'</div><p style="margin-top:8px;font-weight:700">🎁 مكافأتك: لقب «بطل الأمان الرقمي»! معًا نحو جيل واعٍ بأمان الألعاب الإلكترونية.</p><div class="noprint"><button class="btn b" onclick="window.print()">🖨 طباعة الشهادة</button><button class="btn p" id="lb2">🏅 المتصدرون</button><button class="btn r" id="rp">🔄 إعادة اللعب من البداية</button></div></div>'+rankCard(rs);
 $('#lb2').onclick=showBoard;$('#rp').onclick=newGame;$('#lb3').onclick=showBoard;$('#ng').onclick=newGame;
 const rk=$('#rkc'),gr=$('#gr');gr.onclick=()=>rk.scrollIntoView({behavior:'smooth',block:'start'});
 const show=()=>{rk.classList.add('in');if(rs.isNew){const e=$('.rk');setTimeout(()=>{burst(e);if(e&&e.classList.contains('top'))confetti()},700)}};   // تأثير احتفالي عند ظهور ترتيب الطالب
 if('IntersectionObserver' in window){const io=new IntersectionObserver(en=>{if(en[0].isIntersecting){io.disconnect();show()}},{threshold:.25});io.observe(rk)}else show();
 window.scrollTo(0,0)}
$('#bBoard').onclick=showBoard;$('#bMute').onclick=()=>setMute(!S.muted);$('#bHome').onclick=home;
hud();home();
</script>
</body>
</html>
